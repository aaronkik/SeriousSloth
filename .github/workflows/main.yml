name: Main

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main

permissions:
  id-token: write
  contents: read

env:
  DO_NOT_TRACK: 1
  # CodeBuild runners persist /root/.cache to S3 between jobs.
  TURBO_CACHE_DIR: /root/.cache/turbo
  TURBO_CACHE_MAX_SIZE: 500MB
  TURBO_SCM_BASE: ${{ github.event.before }}
  TURBO_SCM_HEAD: ${{ github.sha }}

jobs:
  deploy:
    runs-on:
      - codebuild-SeriousSloth-${{ github.run_id }}-${{ github.run_attempt }}
      - instance-size:medium
      - buildspec-override:true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup mise
        uses: jdx/mise-action@v5.2.8
        with:
          cache: false
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@v2.1.2
        with:
          organization: aaronkik
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:aaronkik
      - name: Deploy staging
        run: turbo run deploy:staging --affected
        env:
          EMOTES_SERVICE_API_URL: ${{ secrets.EMOTES_SERVICE_API_URL }}
          EMOTES_SERVICE_API_KEY: ${{ secrets.EMOTES_SERVICE_API_KEY }}
      - name: Deploy prod
        run: turbo run deploy:prod --affected
        env:
          EMOTES_SERVICE_API_URL: ${{ secrets.EMOTES_SERVICE_API_URL }}
          EMOTES_SERVICE_API_KEY: ${{ secrets.EMOTES_SERVICE_API_KEY }}
