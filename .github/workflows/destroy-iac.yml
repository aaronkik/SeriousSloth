name: Destroy IaC

on:
  pull_request:
    types: [closed]

  workflow_dispatch:
    inputs:
      stack_name:
        description: Pulumi stack name to destroy (e.g. pr-42)
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  DO_NOT_TRACK: 1
  # CodeBuild runners persist /root/.cache to S3 between jobs.
  TURBO_CACHE_DIR: /root/.cache/turbo
  TURBO_CACHE_MAX_SIZE: 500MB
  CI_STACK_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.stack_name || format('pr-{0}', github.event.pull_request.number) }}

jobs:
  destroy:
    runs-on:
      - codebuild-SeriousSloth-${{ github.run_id }}-${{ github.run_attempt }}
      - buildspec-override:true
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup mise
        uses: jdx/mise-action@v5.2.8
        with:
          cache: false
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@v2.1.2
        with:
          organization: aaronkik
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:aaronkik
      - name: Destroy stack
        run: turbo run destroy:ci
