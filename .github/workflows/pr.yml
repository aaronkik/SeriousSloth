name: PR

on:
  - pull_request

concurrency:
  group: pr-${{ github.event.pull_request.number }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  DO_NOT_TRACK: 1
  # CodeBuild runners persist /root/.cache to S3 between jobs.
  TURBO_CACHE_DIR: /root/.cache/turbo
  TURBO_CACHE_MAX_SIZE: 500MB
  TURBO_SCM_BASE: origin/${{ github.base_ref }}
  CI_STACK_NAME: pr-${{ github.event.pull_request.number }}

jobs:
  check:
    runs-on:
      - codebuild-SeriousSloth-${{ github.run_id }}-${{ github.run_attempt }}
      - instance-size:medium
      - buildspec-override:true
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup mise
        uses: jdx/mise-action@v5.2.8
        with:
          cache: false
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check affected
        run: turbo run lint build --affected
        env:
          NEXT_PUBLIC_TWITCH_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          EMOTES_SERVICE_API_URL: ${{ secrets.EMOTES_SERVICE_API_URL }}
          EMOTES_SERVICE_API_KEY: ${{ secrets.EMOTES_SERVICE_API_KEY }}
      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@v2.1.2
        with:
          organization: aaronkik
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:aaronkik
      - name: Check affected tests
        run: turbo run test:ci --affected
      - name: Preview affected staging infrastructure
        run: turbo run preview:staging --affected
